version: 2.1

# Standalone pipeline — deliberately does NOT use the mojaloop/build orb, BY DESIGN.
# This package is a foundational dependency of that orb's license gate, so releasing
# it through the orb would be circular AND would block self-recovery from a bad
# release. It also must test its own source, not the published version.


orbs:
  slack: circleci/slack@4.13.3
  pr-tools: mojaloop/pr-tools@0.1.10
  gh: circleci/github-cli@2.2.0

executors:
  node:
    docker:
      # node:24.15.0-alpine3.22 pinned by digest [4.7]. configure_nvm then switches to .nvmrc.
      - image: node:24.15.0-alpine3.22@sha256:b689d4005875ae167178471a7a622ec2909459a3bbb32277260be1971af7a99f
    shell: "/bin/sh -leo pipefail" ## Ref: https://circleci.com/docs/env-vars/#alpine-linux
    working_directory: &WORKING_DIR /home/circleci/project
    environment:
      BASH_ENV: /etc/profile ## Ref: https://circleci.com/docs/env-vars/#alpine-linux
      NVM_ARCH_UNOFFICIAL_OVERRIDE: x64-musl ## Ref: https://github.com/nvm-sh/nvm/issues/1102#issuecomment-550572252
    resource_class: medium
  machine:
    working_directory: *WORKING_DIR
    shell: "/bin/bash -leo pipefail"
    machine:
      image: ubuntu-2404:2024.11.1

commands:
  alpine_deps:
    description: Install base OS deps (parity with the orb's docker_dependencies).
    steps:
      - run:
          name: Install base dependencies
          # openssh-client provides `ssh` for `git push` over the SSH remote (Alpine lacks it);
          # ca-certificates for TLS. Mirrors the orb's docker_dependencies (minus the native
          # build toolchain this pure-JS package doesn't need).
          command: apk --no-cache add bash git curl tar jq openssh-client ca-certificates

  configure_nvm:
    description: Install/select the Node version from .nvmrc via nvm (parity with the orb).
    steps:
      - run:
          name: Configure NVM (node version from .nvmrc)
          command: |
            cd $HOME
            export ENV_DOT_PROFILE=$HOME/.profile
            touch $ENV_DOT_PROFILE
            if [ -z "$NVM_DIR" ]; then export NVM_DIR="$HOME/.nvm"; fi
            if [ -z "$NVMRC_VERSION" ]; then
              export NVMRC_VERSION=$(cat $CIRCLE_WORKING_DIRECTORY/.nvmrc)
              echo "export NVMRC_VERSION=$NVMRC_VERSION" >> $ENV_DOT_PROFILE
            fi
            if [ ! -e "$NVM_DIR" ]; then
              curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/v0.39.3/install.sh | bash
              [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            fi
            ## Ref: https://github.com/nvm-sh/nvm/issues/1102#issuecomment-550572252
            if [ ! -z "$NVM_ARCH_UNOFFICIAL_OVERRIDE" ]; then
              echo "nvm_get_arch() { nvm_echo \"${NVM_ARCH_UNOFFICIAL_OVERRIDE}\"; }" >> $ENV_DOT_PROFILE
              echo "export NVM_NODEJS_ORG_MIRROR=https://unofficial-builds.nodejs.org/download/release" >> $ENV_DOT_PROFILE
              source $ENV_DOT_PROFILE
            fi
            nvm install $NVMRC_VERSION
            nvm alias default $NVMRC_VERSION
            nvm use $NVMRC_VERSION

  display_versions:
    description: Print active tool versions.
    steps:
      - run:
          name: Display versions
          command: |
            echo "node: $(node --version)"
            echo "npm:  $(npm --version)"

  configure_git:
    description: Configure git identity for release commits.
    steps:
      - run:
          name: Configure git
          command: |
            git config user.email "${GIT_CI_EMAIL}"
            git config user.name "${GIT_CI_USER}"

jobs:
  test:
    # No secret context: this job runs repo-controlled code (lint, tests, self-scan)
    # on every branch and must never have publish credentials in scope.
    executor: node
    steps:
      - alpine_deps
      - checkout
      - configure_nvm
      - display_versions
      - run:
          name: Install dependencies
          command: npm ci --ignore-scripts # never run dependency install scripts
      - run:
          name: Lint (eslint)
          command: npm run lint
      - run:
          name: Validate policy (SPDX lint of data.json)
          command: npm run validate
      - run:
          name: Unit tests
          command: npm test
      - run:
          name: Audit dependencies
          command: npm run audit:check
      - run:
          name: Self-scan (dogfood the gate on this package's own deps)
          command: |
            set -eu
            # syft installer pinned to a release tag, not mutable main
            curl -sSfL https://raw.githubusercontent.com/anchore/syft/v1.45.0/install.sh | sh -s -- -b /usr/local/bin v1.45.0
            node src/cli.js .

  release:
    # Auto-release on main: bump version + CHANGELOG via standard-version, push the tag.
    executor: node
    steps:
      - alpine_deps
      - checkout
      - configure_nvm
      - configure_git
      - run:
          name: Install dependencies
          command: npm ci --ignore-scripts
      - run:
          name: Setup Slack config
          command: |
            echo "export SLACK_PROJECT_NAME=${CIRCLE_PROJECT_REPONAME}" >> $BASH_ENV
            echo "export SLACK_RELEASE_TYPE='GitHub Release'" >> $BASH_ENV
            echo "export SLACK_RELEASE_TAG='${CIRCLE_BRANCH} branch'" >> $BASH_ENV
            echo "export SLACK_BUILD_ID=${CIRCLE_BUILD_NUM}" >> $BASH_ENV
            echo "export SLACK_CI_URL=${CIRCLE_BUILD_URL}" >> $BASH_ENV
      - run:
          name: Generate changelog and bump package version
          command: |
            set -eu
            # --no-verify: skip git hooks (pre-commit) on the release commit, as the orb does
            npm run release -- --no-verify
      - run:
          name: Push the release
          command: |
            set -eu
            git push --follow-tags origin "${CIRCLE_BRANCH}"
      - slack/notify:
          event: fail
          template: SLACK_TEMP_RELEASE_FAILURE

  github-release:
    executor: machine
    steps:
      - gh/install
      - checkout
      - configure_git
      - run:
          name: Fetch updated release branch
          command: |
            set -eu
            git fetch origin
            git checkout "origin/${CIRCLE_BRANCH}"
      - run:
          name: Get release tag + changelog
          command: |
            set -eu
            RELEASE_TAG="$(jq -r .version package.json)"
            # validate version before use; notes are NOT exported to BASH_ENV
            echo "${RELEASE_TAG}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' \
              || { echo "Refusing: invalid version '${RELEASE_TAG}'"; exit 1; }
            echo "export RELEASE_TAG=${RELEASE_TAG}" >> "$BASH_ENV"
            git diff --no-indent-heuristic HEAD~1 HEAD CHANGELOG.md | sed -n '/^+[^+]/ s/^+//p' > /tmp/changes
      - run:
          name: Setup Slack config
          command: |
            source "$BASH_ENV"
            echo "export SLACK_PROJECT_NAME=${CIRCLE_PROJECT_REPONAME}" >> $BASH_ENV
            echo "export SLACK_RELEASE_TYPE='Github Release'" >> $BASH_ENV
            echo "export SLACK_RELEASE_TAG=v${RELEASE_TAG}" >> $BASH_ENV
            echo "export SLACK_RELEASE_URL=https://github.com/mojaloop/${CIRCLE_PROJECT_REPONAME}/releases/tag/v${RELEASE_TAG}" >> $BASH_ENV
            echo "export SLACK_BUILD_ID=${CIRCLE_BUILD_NUM}" >> $BASH_ENV
            echo "export SLACK_CI_URL=${CIRCLE_BUILD_URL}" >> $BASH_ENV
      - run:
          name: Create GitHub release
          command: |
            set -eu
            source "$BASH_ENV"
            # [3.3] notes passed via file, never re-evaluated by the shell
            gh release create "v${RELEASE_TAG}" --title "v${RELEASE_TAG} Release" --notes-file /tmp/changes ./CHANGELOG.md
      - slack/notify:
          event: pass
          template: SLACK_TEMP_RELEASE_SUCCESS
      - slack/notify:
          event: fail
          template: SLACK_TEMP_RELEASE_FAILURE

  publish-npm:
    executor: node
    steps:
      - alpine_deps
      - checkout
      - configure_nvm
      - display_versions
      - run:
          name: Install dependencies
          command: npm ci --ignore-scripts
      - run:
          name: Lint (eslint)
          command: npm run lint
      - run:
          name: Validate policy
          command: npm run validate
      - run:
          name: Unit tests
          command: npm test
      - run:
          name: Audit dependencies
          command: npm run audit:check
      - run:
          name: Setup Slack config
          command: |
            echo "export SLACK_PROJECT_NAME=${CIRCLE_PROJECT_REPONAME}" >> $BASH_ENV
            echo "export SLACK_RELEASE_TYPE='NPM Release'" >> $BASH_ENV
            echo "export SLACK_RELEASE_TAG=v${CIRCLE_TAG:1}" >> $BASH_ENV
            echo "export SLACK_RELEASE_URL=https://www.npmjs.com/package/@mojaloop/${CIRCLE_PROJECT_REPONAME}/v/${CIRCLE_TAG:1}" >> $BASH_ENV
            echo "export SLACK_BUILD_ID=${CIRCLE_BUILD_NUM}" >> $BASH_ENV
            echo "export SLACK_CI_URL=${CIRCLE_BUILD_URL}" >> $BASH_ENV
      - run:
          name: Authenticate and publish to npm
          command: |
            set -eu
            : "${NPM_TOKEN:?NPM_TOKEN is required}"
            VERSION="$(node -p "require('./package.json').version")"
            echo "${VERSION}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' \
              || { echo "Refusing to publish: invalid version '${VERSION}'"; exit 1; }
            umask 077
            trap 'rm -f "$HOME/.npmrc"' EXIT
            printf '//registry.npmjs.org/:_authToken=%s\n' "$NPM_TOKEN" > "$HOME/.npmrc"
            chmod 600 "$HOME/.npmrc"
            npm publish --ignore-scripts --access public
      - slack/notify:
          event: pass
          template: SLACK_TEMP_RELEASE_SUCCESS
      - slack/notify:
          event: fail
          template: SLACK_TEMP_RELEASE_FAILURE

workflows:
  build_and_test:
    jobs:
      # pr-title-check needs GitHub read (orb-fixed steps, no repo code). org-global is
      # acceptable here; a github-read-only context would be tighter.
      - pr-tools/pr-title-check:
          context: org-global
          filters:
            branches:
              ignore:
                - main

      - test: # no context — runs repo code on all branches [3.2]
          filters:
            tags:
              only: /.*/
            branches:
              ignore:
                - /feature*/
                - /bugfix*/

      - release:
          # org-global: GIT_CI_* + SLACK_*. Tag push via SSH user key (no token needed).
          context: org-global
          requires:
            - test
          filters:
            branches:
              only:
                - main
                - /release\/v.*/

      - github-release:
          # org-release: GITHUB_TOKEN (restricted). org-global: GIT_CI_* + SLACK_*.
          context: [org-global, org-release]
          requires:
            - release
          filters:
            branches:
              only:
                - main
                - /release\/v.*/

      - publish-npm:
          # org-release: NPM_TOKEN (restricted). org-global: SLACK_*.
          context: [org-global, org-release]
          requires:
            - test
          filters:
            tags:
              only: /^v\d+\.\d+\.\d+$/
            branches:
              ignore: /.*/
